name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlassyWidgets.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: GlassyWidgets-debug-apk
          path: GlassyWidgets.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glassy Widgets (build ${{ github.run_number }})
          body: APK de depuración compilado automáticamente desde ${{ github.sha }}.
          files: GlassyWidgets.apk
          make_latest: true

      - name: Guardar APK en la rama "builds"
        run: |
          mkdir /tmp/out && cp GlassyWidgets.apk /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add GlassyWidgets.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
